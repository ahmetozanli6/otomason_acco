<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#1E2D3D">
  
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  
  <title>Yanteks Pro | Mega Panel</title>
  
  <script>
    // PWA Cache Zorla Temizleme (Eski bozuk sayfayı görmemeniz için)
    try {
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          for(let registration of registrations) registration.unregister();
        }).catch(e => console.warn(e));
      }
    } catch (e) {}
  </script>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.3.0/exceljs.min.js"></script>

  <style>
    :root {
      --bg: #F3F5F7;
      --surface: #FFFFFF;
      --border: rgba(30,45,61,0.15);
      --text: #0A1520;
      --text-sec: #64748B;
      --primary: #0891B2;
      --navy: #0F172A;
      --red: #DC2626;
      --font: 'Inter', sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body, html { width: 100%; height: 100%; font-family: var(--font); background-color: var(--bg); color: var(--text); overflow: hidden; }
    
    .hide-scroll { -ms-overflow-style: none; scrollbar-width: none; }
    .hide-scroll::-webkit-scrollbar { display: none; }

    /* Layout & Sidebar */
    .app-container { display: flex; width: 100%; height: 100vh; overflow: hidden; position: relative; }
    .sidebar { width: 260px; background-color: var(--navy); color: #fff; display: flex; flex-direction: column; flex-shrink: 0; z-index: 50; transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); border-right: 1px solid rgba(255,255,255,0.05); position: relative;}
    .sidebar-header { height: 64px; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; border-bottom: 1px solid rgba(255,255,255,0.08); flex-shrink: 0; }
    .nav-button { display: flex; align-items: center; gap: 12px; width: 100%; padding: 12px 16px; margin-bottom: 4px; border-radius: 12px; border: none; background: transparent; color: rgba(255,255,255,0.6); font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.2s; text-align: left; text-decoration: none; }
    .nav-button:hover { background: rgba(255,255,255,0.05); color: #fff; }
    .nav-button.active { background: linear-gradient(135deg, var(--primary), #0284C7); color: #fff; box-shadow: 0 4px 12px rgba(8,145,178,0.3); }

    /* Main Content & SPA Routing */
    .main-content { flex: 1; display: flex; flex-direction: column; min-width: 0; position: relative; background: var(--bg); }
    .header { height: 64px; background: var(--surface); border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; padding: 0 24px; flex-shrink: 0; z-index: 10; }
    .scroll-area { flex: 1; overflow-y: auto; padding: 24px; position: relative; }
    
    .view-section { display: none; animation: fadeUp 0.3s ease forwards; }
    .view-section.active-view { display: block; }

    /* Mobile adjustments */
    @media (max-width: 1023px) {
      .sidebar { position: fixed; top: 0; left: 0; bottom: 0; transform: translateX(-100%); }
      .sidebar.open { transform: translateX(0); }
      .menu-toggle-btn { display: block; }
      .desktop-only { display: none !important; }
    }
    @media (min-width: 1024px) {
      .menu-toggle-btn { display: none; }
      .overlay { display: none !important; }
    }

    .overlay { position: fixed; inset: 0; background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(2px); z-index: 40; display: none; }
    .overlay.open { display: block; }

    /* UI Components */
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 10px 16px; border-radius: 8px; border: none; font-size: 13px; font-weight: 600; cursor: pointer; transition: all 0.2s; font-family: inherit; }
    .btn:active { transform: scale(0.96); }
    .btn-primary { background-color: var(--primary); color: #fff; box-shadow: 0 2px 10px rgba(8,145,178,0.2); }
    .btn-outline { background-color: var(--surface); color: var(--text-sec); border: 1px solid rgba(30,45,61,0.2); }
    .btn-icon { background: var(--surface); border: 1px solid rgba(30,45,61,0.15); border-radius: 8px; padding: 6px; cursor: pointer; color: var(--text-sec); transition: all 0.2s; display: inline-flex; align-items: center; justify-content: center; }
    .btn-icon:hover { background: var(--bg); color: var(--text); }

    .input { width: 100%; padding: 10px 14px; border-radius: 8px; border: 1px solid rgba(30,45,61,0.2); font-family: inherit; font-size: 13px; outline: none; transition: all 0.2s; background: var(--surface); }
    .input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(8,145,178,0.15); }

    .card { background: var(--surface); border-radius: 16px; border: 1px solid rgba(30,45,61,0.1); overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.02); margin-bottom: 24px; }
    .card-header { background: #F8FAFC; padding: 16px; border-bottom: 1px solid rgba(30,45,61,0.1); display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; }
    .list-item { padding: 16px; border-bottom: 1px solid rgba(30,45,61,0.06); display: flex; gap: 16px; transition: background 0.2s; }
    .list-item:hover { background: #F8FAFC; }
    .list-item.variant { margin-left: 32px; border-left: 3px solid rgba(30,45,61,0.1); }

    .chip-filter { padding: 6px 16px; border-radius: 20px; font-size: 12px; font-weight: 700; cursor: pointer; border: 1px solid rgba(30,45,61,0.15); background: var(--surface); color: var(--text-sec); transition: all 0.2s; white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; }
    .chip-filter.active { background: var(--navy); color: #fff; border-color: var(--navy); }

    /* Modals & Toasts */
    .drawer { position: fixed; bottom: 0; left: 0; right: 0; background: var(--surface); border-radius: 24px 24px 0 0; padding: 24px; z-index: 100; transform: translateY(100%); transition: transform 0.3s cubic-bezier(0.32,0.72,0,1); max-height: 90vh; overflow-y: auto; box-shadow: 0 -10px 40px rgba(0,0,0,0.2); }
    .drawer.open { transform: translateY(0); }
    .drawer-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); backdrop-filter: blur(2px); z-index: 90; display: none; }
    .drawer-overlay.open { display: block; }
    
    .photo-viewer { position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 200; display: none; flex-direction: column; }
    .photo-viewer.open { display: flex; }

    .toast { position: fixed; bottom: 32px; left: 50%; transform: translateX(-50%) translateY(100px); background: var(--navy); color: #fff; padding: 14px 24px; border-radius: 30px; font-size: 14px; font-weight: 700; z-index: 999; box-shadow: 0 10px 25px rgba(0,0,0,0.2); display: flex; align-items: center; gap: 10px; transition: transform 0.3s ease; opacity: 0; pointer-events: none; }
    .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
    .toast.error { background: var(--red); }

    .spin { animation: spin 1s linear infinite; }
    @keyframes spin { 100% { transform: rotate(360deg); } }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    
    .status-badge { font-size: 10px; font-weight: 800; padding: 2px 8px; border-radius: 6px; border: 1px solid; }
    .status-beklemede { background: #FEF3C7; color: #B45309; border-color: #FDE68A; }
    .status-takip { background: #CFFAFE; color: #0E7490; border-color: #A5F3FC; }
    .status-gonderildi { background: #DBEAFE; color: #1D4ED8; border-color: #BFDBFE; }
    .status-onaylandi { background: #DCFCE7; color: #15803D; border-color: #BBF7D0; }
    .status-reddedildi { background: #FEE2E2; color: #B91C1C; border-color: #FECACA; }
  </style>
</head>
<body>

  <div class="app-container">
    <div id="mobileOverlay" class="overlay" onclick="window.toggleSidebar()"></div>

    <!-- YAN MENÜ (Bütün linkler sayfa yenilenmeden geçiş yapar) -->
    <aside id="sidebar" class="sidebar">
      <div class="sidebar-header">
        <div style="display: flex; align-items: center; gap: 10px;">
          <div style="width: 32px; height: 32px; border-radius: 8px; background: var(--primary); display: flex; align-items: center; justify-content: center;">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
          </div>
          <span style="font-size: 18px; font-weight: 800; letter-spacing: -0.5px;">Yanteks<span style="color: #38BDF8;">Pro</span></span>
        </div>
        <button class="menu-toggle-btn" onclick="window.toggleSidebar()" style="background: none; border: none; color: #94A3B8; cursor: pointer;">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
        </button>
      </div>
      
      <nav class="hide-scroll" style="flex: 1; overflow-y: auto; padding: 16px 12px;">
        <p style="padding: 0 16px 8px; font-size: 10px; font-weight: 700; color: #64748B; letter-spacing: 1px;">MODÜLLER (SPA)</p>
        
        <button onclick="window.switchTab('dashboard')" id="nav-dashboard" class="nav-button">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect width="7" height="9" x="3" y="3" rx="1"/><rect width="7" height="5" x="14" y="3" rx="1"/><rect width="7" height="9" x="14" y="12" rx="1"/><rect width="7" height="5" x="3" y="16" rx="1"/></svg><span>Özet Panel</span>
        </button>
        
        <button onclick="window.switchTab('samples')" id="nav-samples" class="nav-button active">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m7.5 4.27 9 5.15"/><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5"/><path d="M12 22V12"/></svg><span>Numuneler</span>
        </button>
        
        <button onclick="window.switchTab('customers')" id="nav-customers" class="nav-button">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg><span>Müşteriler</span>
        </button>
        
        <button onclick="window.switchTab('prices')" id="nav-prices" class="nav-button">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M16 8h-6a2 2 0 1 0 0 4h4a2 2 0 1 1 0 4H8"/><path d="M12 18V6"/></svg><span>Fiyatlar</span>
        </button>
        
        <button onclick="window.switchTab('costs')" id="nav-costs" class="nav-button">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect width="16" height="20" x="4" y="2" rx="2"/><line x1="8" x2="16" y1="6" y2="6"/><line x1="16" x2="16.01" y1="14" y2="14"/><line x1="16" x2="16.01" y1="18" y2="18"/><line x1="12" x2="12.01" y1="14" y2="14"/><line x1="12" x2="12.01" y1="18" y2="18"/><line x1="8" x2="8.01" y1="14" y2="14"/><line x1="8" x2="8.01" y1="18" y2="18"/></svg><span>Maliyet</span>
        </button>
        
        <button onclick="window.switchTab('offers')" id="nav-offers" class="nav-button">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg><span>Teklifler</span>
        </button>
        
        <button onclick="window.switchTab('notes')" id="nav-notes" class="nav-button">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/><line x1="16" x2="8" y1="13" y2="13"/><line x1="16" x2="8" y1="17" y2="17"/><line x1="10" x2="8" y1="9" y2="9"/></svg><span>Notlarım</span>
        </button>
        
        <button onclick="window.switchTab('converter')" id="nav-converter" class="nav-button">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="16 3 21 3 21 8"/><line x1="4" y1="14" x2="21" y2="3"/><polyline points="8 21 3 21 3 16"/><line x1="20" y1="10" x2="3" y2="21"/></svg><span>Dönüştürücü</span>
        </button>
      </nav>
      
      <div style="padding: 14px 20px; border-top: 1px solid rgba(255,255,255,0.08); font-size: 10px; font-weight: 600; color: rgba(255,255,255,0.2); letter-spacing: 1px;">
        YANTEKS PRO v2.0
      </div>
    </aside>

    <!-- ANA İÇERİK ALANI -->
    <main class="main-content">
      <header class="header">
        <div style="display: flex; align-items: center; gap: 16px;">
          <button class="menu-toggle-btn btn-icon" onclick="window.toggleSidebar()" style="border: none; padding: 4px;">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="6" y2="6"/><line x1="4" x2="20" y1="18" y2="18"/></svg>
          </button>
          <div>
            <h2 id="header-title" style="font-size: 18px; font-weight: 800; margin: 0;">Numuneler</h2>
            <p class="desktop-only" style="font-size: 12px; color: var(--text-sec); margin-top: 2px;">Sisteme hoş geldiniz.</p>
          </div>
        </div>

        <div style="display: flex; align-items: center; gap: 12px;">
          <div class="desktop-only" style="position: relative;">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#94A3B8" stroke-width="2" style="position: absolute; left: 12px; top: 50%; transform: translateY(-50%);"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
            <input type="text" id="globalSearch" placeholder="Hızlı Arama..." class="input" style="padding-left: 36px; width: 220px; border-radius: 20px;" oninput="window.globalSearch()">
          </div>
          <button class="btn-icon" onclick="window.fetchData()" title="Yenile">
            <svg id="refreshIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
          </button>
          <div style="width: 36px; height: 36px; border-radius: 50%; background: var(--primary); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px;">YP</div>
        </div>
      </header>

      <div class="scroll-area hide-scroll" style="max-width: 1200px; margin: 0 auto; width: 100%;">
        
        <!-- Yükleniyor Durumu -->
        <div id="loadingState" style="height: 200px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; color: var(--primary);">
          <svg class="spin" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
          <span style="font-weight: 600; color: var(--text-sec);">Sistem Yükleniyor...</span>
        </div>

        <div id="mainContent" style="display: none; padding-bottom: 60px;">
          
          <!-- ==============================================
               1. ÖZET PANEL
               ============================================== -->
          <div id="view-dashboard" class="view-section">
            <h3 style="font-size: 20px; font-weight: 800; margin-bottom: 20px;">Sistem Özeti</h3>
            <div id="dashboardStats" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px;">
              <!-- JS ile dolar -->
            </div>
          </div>

          <!-- ==============================================
               2. NUMUNELER
               ============================================== -->
          <div id="view-samples" class="view-section active-view">
            <!-- Araç Çubuğu -->
            <div style="display: flex; flex-wrap: wrap; gap: 16px; justify-content: space-between; align-items: center; margin-bottom: 24px;">
              <div style="display: flex; gap: 12px;">
                <button onclick="window.openDrawer()" class="btn btn-primary"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14"/><path d="M12 5v14"/></svg> Yeni Numune</button>
                <button onclick="window.exportExcel()" class="btn btn-outline"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/><line x1="12" x2="12" y1="18" y2="12"/><line x1="8" x2="8" y1="18" y2="15"/><line x1="16" x2="16" y1="18" y2="14"/></svg> Excel'e Aktar</button>
              </div>
              <div id="filterChips" class="hide-scroll" style="display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px;"></div>
            </div>

            <!-- Toplu İşlem Menüsü -->
            <div id="bulkActions" style="display: none; background: var(--navy); color: #fff; padding: 12px 20px; border-radius: 12px; flex-wrap: wrap; gap: 16px; justify-content: space-between; align-items: center; margin-bottom: 24px; box-shadow: 0 10px 25px rgba(0,0,0,0.1);">
              <span style="font-weight: 700; font-size: 14px; background: rgba(255,255,255,0.1); padding: 4px 10px; border-radius: 8px;"><span id="selCount">0</span> Seçili</span>
              <div style="display: flex; flex-wrap: wrap; gap: 8px;">
                <button onclick="window.bulkUpdateStatus('Beklemede')" style="background: rgba(255,255,255,0.1); border: none; color: #fff; padding: 6px 12px; border-radius: 6px; font-size: 12px; font-weight: 600; cursor: pointer;">Beklemede</button>
                <button onclick="window.bulkUpdateStatus('Takip Et')" style="background: rgba(255,255,255,0.1); border: none; color: #fff; padding: 6px 12px; border-radius: 6px; font-size: 12px; font-weight: 600; cursor: pointer;">Takip Et</button>
                <button onclick="window.bulkUpdateStatus('Gönderildi')" style="background: rgba(255,255,255,0.1); border: none; color: #fff; padding: 6px 12px; border-radius: 6px; font-size: 12px; font-weight: 600; cursor: pointer;">Gönderildi</button>
                <button onclick="window.bulkUpdateStatus('Onaylandı')" style="background: rgba(255,255,255,0.1); border: none; color: #fff; padding: 6px 12px; border-radius: 6px; font-size: 12px; font-weight: 600; cursor: pointer;">Onaylandı</button>
                <button onclick="window.bulkDelete()" style="background: rgba(220,38,38,0.2); color: #FCA5A5; border: none; padding: 6px 12px; border-radius: 6px; font-size: 12px; font-weight: 700; cursor: pointer;">Sil</button>
                <button onclick="window.clearSelection()" style="background: transparent; border: none; color: #94A3B8; padding: 6px; cursor: pointer;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button>
              </div>
            </div>

            <div style="display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 24px;">
              <div style="position: relative; flex: 1; min-width: 250px;">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#94A3B8" stroke-width="2" style="position: absolute; left: 14px; top: 50%; transform: translateY(-50%);"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
                <input type="text" id="searchInput" placeholder="Firma, kod veya not arayın..." class="input" style="padding-left: 40px;" oninput="window.renderSamples()">
              </div>
              <div style="display: flex; background: #fff; border: 1px solid var(--border); border-radius: 8px; padding: 4px;">
                <button onclick="window.changeSort('date')" id="sort_date" style="padding: 6px 12px; border-radius: 6px; font-size: 12px; font-weight: 700; border: none; cursor: pointer;">Tarih</button>
                <button onclick="window.changeSort('alpha')" id="sort_alpha" style="padding: 6px 12px; border-radius: 6px; font-size: 12px; font-weight: 700; border: none; cursor: pointer;">A-Z</button>
                <button onclick="window.changeSort('status')" id="sort_status" style="padding: 6px 12px; border-radius: 6px; font-size: 12px; font-weight: 700; border: none; cursor: pointer;">Durum</button>
              </div>
            </div>

            <div id="firmaBanner" style="display: none; background: #ECFEFF; border: 1px solid #A5F3FC; padding: 12px 20px; border-radius: 12px; justify-content: space-between; align-items: center; margin-bottom: 24px; color: #0E7490;">
              <span style="font-weight: 700; font-size: 14px;">🏢 <span id="bannerFirmaName"></span> firmasının kayıtları</span>
              <button onclick="window.setFirmaFilter('')" style="background: #CFFAFE; border: none; color: var(--primary); font-weight: 700; font-size: 12px; padding: 6px 12px; border-radius: 6px; cursor: pointer;">Tümünü Göster</button>
            </div>

            <div id="dataListContainer"></div>
          </div>

          <!-- ==============================================
               3. MÜŞTERİLER
               ============================================== -->

    </div>

      <button onclick="window.pvNav(-1)" style="position: absolute; left: 24px; background: rgba(255,255,255,0.1); border: none; color: #fff; width: 50px; height: 50px; border-radius: 50%; font-size: 24px; cursor: pointer;">‹</button>
      <img id="pvImage" src="" style="max-width: 100%; max-height: 100%; object-fit: contain;" alt=""/>
      <button onclick="window.pvNav(1)" style="position: absolute; right: 24px; background: rgba(255,255,255,0.1); border: none; color: #fff; width: 50px; height: 50px; border-radius: 50%; font-size: 24px; cursor: pointer;">›</button>
    </div>

      <button onclick="window.deleteCurrentPhoto()" style="background: rgba(220,38,38,0.2); border: 1px solid rgba(220,38,38,0.3); color: #FECACA; padding: 12px 24px; border-radius: 12px; font-weight: 700; cursor: pointer; display: inline-flex; align-items: center; gap: 8px;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg> Bu Fotoğrafı Sil</button>

  <!-- TOAST BİLDİRİMİ -->
  <div id="toast" class="toast">
    <svg id="toastIconOk" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#38BDF8" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><path d="m9 11 3 3L22 4"/></svg>
    <svg id="toastIconErr" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FECACA" stroke-width="2" style="display:none;"><circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/></svg>
    <span id="toastMsg"></span>
  </div>

  <script>
    // ==========================================
    // 0. TAB YÖNETİMİ (SPA)
    // ==========================================
    const tabTitles = {
      'dashboard': 'Özet Panel', 'samples': 'Numuneler', 'customers': 'Müşteriler',
      'prices': 'Fiyatlar', 'costs': 'Maliyet', 'offers': 'Teklifler',
      'notes': 'Notlarım', 'converter': 'Dönüştürücü'
    };

    window.switchTab = function(tabId) {
      document.querySelectorAll('.view-section').forEach(v => v.classList.remove('active-view'));
      const activeView = document.getElementById('view-' + tabId);
      if(activeView) activeView.classList.add('active-view');
      
      document.querySelectorAll('.nav-button').forEach(btn => btn.classList.remove('active'));
      const activeBtn = document.getElementById('nav-' + tabId);
      if(activeBtn) activeBtn.classList.add('active');
      
      document.getElementById('header-title').innerText = tabTitles[tabId] || 'Yanteks Pro';
      
      if (window.innerWidth < 1024) {
        document.getElementById('sidebar').classList.remove('open');
        document.getElementById('mobileOverlay').classList.remove('open');
      }
    };

    // ==========================================
    // 1. SUPABASE & STATE
    // ==========================================
    window.SUPABASE_URL = 'https://zmlbdpjcergcvcurihuy.supabase.co';
    window.SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InptbGJkcGpjZXJnY3ZjdXJpaHV5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU1MTA2MzIsImV4cCI6MjA5MTA4NjYzMn0.Jh4e_UXSL7CH7EzLBhhXtQYM0-iQwrFU3GHnoe-njBM';
    window.dbClient = window.supabase.createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY);
    
    window.state = {
      samples: [], customers: [], notes: [], prices: [], costs: [], offers: [],
      photoCache: {}, filter: 'Hepsi', sortType: 'date', firmaFilter: '',
      selectedIds: new Set(), editId: null, formRows: [],
      currentPvPhotos: [], currentPvIndex: 0,
      VALID_STATUS: ['Beklemede', 'Takip Et', 'Gönderildi', 'Onaylandı', 'Reddedildi']
    };

    // ==========================================
    // 2. YARDIMCI FONKSİYONLAR
    // ==========================================
    window.formatDate = function(dateStr) {
      if (!dateStr) return '-';
      try {
        var d = new Date(dateStr), now = new Date();
        var diff = Math.floor((now - d) / 86400000);
        if (diff === 0) return 'bugün';
        if (diff === 1) return 'dün';
        if (diff < 7) return diff + 'g';
        if (diff < 30) return Math.floor(diff / 7) + 'h';
        return d.toLocaleDateString('tr-TR', { day: '2-digit', month: 'short' });
      } catch (e) { return dateStr; }
    };

    window.isV = function(n) { return typeof n === 'string' && n.startsWith('↳'); };
    window.dName = function(n) { return typeof n === 'string' ? n.replace(/^↳\s*/, '').trim() : ''; };
    
    window.getStatusStyle = function(st) {
      const map = { 'Beklemede': 'status-beklemede', 'Takip Et': 'status-takip', 'Gönderildi': 'status-gonderildi', 'Onaylandı': 'status-onaylandi', 'Reddedildi': 'status-reddedildi' };
      return map[st] || 'status-beklemede';
    };

    window.toggleSidebar = function() {
      document.getElementById('sidebar').classList.toggle('open');
      document.getElementById('mobileOverlay').classList.toggle('open');
    };

    window.showToast = function(msg, type = 'ok') {
      const t = document.getElementById('toast');
      document.getElementById('toastMsg').innerText = msg;
      document.getElementById('toastIconOk').style.display = type === 'ok' ? 'block' : 'none';
      document.getElementById('toastIconErr').style.display = type === 'err' ? 'block' : 'none';
      if(type === 'err') t.classList.add('error'); else t.classList.remove('error');
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 3000);
    };

    // ==========================================
    // 3. VERİ ÇEKME & DİĞER MODÜLLER
    // ==========================================
    async function safeFetch(table) {
      const {data, error} = await window.dbClient.from(table).select('*').order('created_at', {ascending: false});
      if(error) { console.warn(table + ' verisi çekilemedi: ', error); return []; }
      return data || [];
    }

    window.fetchData = async function() {
      document.getElementById('refreshIcon').classList.add('spin');
      document.getElementById('loadingState').style.display = 'flex';
      document.getElementById('mainContent').style.display = 'none';

      try {
        window.state.samples = await safeFetch('numuneler');
        window.state.customers = await safeFetch('musteriler');
        window.state.notes = await safeFetch('notlar');
        window.state.prices = await safeFetch('fiyatlar');
        window.state.costs = await safeFetch('maliyetler');
        window.state.offers = await safeFetch('teklifler');

        // Sort Numuneler logically (Ana varyant önce)
        window.state.samples.sort((a,b) => {
          const ta = new Date(a.created_at).getTime(), tb = new Date(b.created_at).getTime();
          if(ta === tb) return window.isV(a.numune) ? 1 : -1;
          return tb - ta;
        });
        
        window.state.samples.slice(0, 20).forEach(s => window.fetchPhotos(s.id));
        window.renderAllViews();
        
        document.getElementById('loadingState').style.display = 'none';
        document.getElementById('mainContent').style.display = 'block';
      } catch (err) {
        window.showToast('Sistem yüklenirken hata oluştu.', 'err');
      } finally {
        document.getElementById('refreshIcon').classList.remove('spin');
      }
    };

    window.renderAllViews = function() {
      window.renderSamples();
      window.renderDashboard();
      window.renderGenericList('customers', 'customersList', 'firma_adi', 'adres', 'musteriler');
      window.renderGenericList('notes', 'notesList', 'baslik', 'icerik', 'notlar');
      window.renderGenericList('prices', 'pricesList', 'urun', 'fiyat', 'fiyatlar');
      window.renderGenericList('costs', 'costsList', 'urun', 'maliyet', 'maliyetler');
      window.renderGenericList('offers', 'offersList', 'firma', 'tutar', 'teklifler');
    };

    // ==========================================
    // 4. NUMUNELER & SİLME / GÜNCELLEME İŞLEMLERİ (SORUNSUZ ID)
    // ==========================================
    window.renderSamples = function() {
      let activeCount = window.state.samples.filter(i => !i.arsiv).length;
      let chipsHtml = '';
      ['Hepsi', 'Beklemede', 'Takip Et', 'Gönderildi', 'Onaylandı', 'Reddedildi', 'Arşiv'].forEach(f => {
        let count = f === 'Hepsi' ? activeCount : f === 'Arşiv' ? window.state.samples.filter(i => i.arsiv).length : window.state.samples.filter(i => !i.arsiv && i.durum === f).length;
        let isActive = window.state.filter === f;
        chipsHtml += `<button onclick="window.setFilter('${f}')" class="chip-filter ${isActive ? 'active' : ''}">${f} <span style="padding: 2px 6px; border-radius: 10px; font-size: 10px; background: ${isActive ? 'rgba(255,255,255,0.2)' : 'var(--bg)'}">${count}</span></button>`;
      });
      document.getElementById('filterChips').innerHTML = chipsHtml;

      document.getElementById('sort_date').style.background = window.state.sortType === 'date' ? 'var(--bg)' : 'transparent';
      document.getElementById('sort_alpha').style.background = window.state.sortType === 'alpha' ? 'var(--bg)' : 'transparent';
      document.getElementById('sort_status').style.background = window.state.sortType === 'status' ? 'var(--bg)' : 'transparent';

      let result = [...window.state.samples];
      if (window.state.filter === 'Arşiv') result = result.filter(i => i.arsiv === true);
      else {
        result = result.filter(i => i.arsiv !== true);
        if (window.state.filter !== 'Hepsi') result = result.filter(i => i.durum === window.state.filter);
      }
      
      if (window.state.firmaFilter) {
        document.getElementById('firmaBanner').style.display = 'flex';
        document.getElementById('bannerFirmaName').innerText = window.state.firmaFilter;
        result = result.filter(i => (i.firma || '').toUpperCase() === window.state.firmaFilter.toUpperCase());
      } else {
        document.getElementById('firmaBanner').style.display = 'none';
      }

      const q = (document.getElementById('searchInput').value || '').toLowerCase().trim();
      if (q) result = result.filter(i => (i.firma||'').toLowerCase().includes(q) || (i.numune||'').toLowerCase().includes(q) || (i.aciklama||'').toLowerCase().includes(q));

      const G = {};
      result.forEach(i => {
        const f = (i.firma || 'BELİRSİZ').toUpperCase();
        if(!G[f]) G[f] = [];
        G[f].push(i);
      });

      let fKeys = Object.keys(G);
      if(window.state.sortType === 'alpha') fKeys.sort();
      else if(window.state.sortType === 'status') fKeys.sort((a,b) => Math.min(...G[a].map(i => window.state.VALID_STATUS.indexOf(i.durum||'Beklemede'))) - Math.min(...G[b].map(i => window.state.VALID_STATUS.indexOf(i.durum||'Beklemede'))));
      else fKeys.sort((a,b) => Math.max(...G[b].map(i => new Date(i.updated_at||i.created_at).getTime())) - Math.max(...G[a].map(i => new Date(i.updated_at||i.created_at).getTime())));

      const container = document.getElementById('dataListContainer');
      if (fKeys.length === 0) {
        container.innerHTML = `<div style="text-align: center; padding: 60px 20px; background: #fff; border-radius: 16px; border: 1px dashed var(--border);"><p style="font-weight: 700; color: var(--text); font-size: 16px;">Kayıt Bulunamadı</p></div>`;
        return;
      }

      let html = '';
      fKeys.forEach(firma => {
        const anaItems = G[firma].filter(i => !window.isV(i.numune));
        const varItems = G[firma].filter(i => window.isV(i.numune));
        const finalItems = [];
        const usedVarIds = new Set();

        anaItems.forEach(ana => {
          finalItems.push(ana);
          const anaKod = window.dName(ana.numune);
          varItems.forEach(v => {
            if(usedVarIds.has(v.id)) return;
            const pc = (v.aciklama || '').split('|')[0];
            if(pc === anaKod || (v.aciklama||'').startsWith(anaKod+'|')) {
              usedVarIds.add(v.id); finalItems.push(v);
            }
          });
        });
        varItems.filter(v => !usedVarIds.has(v.id)).forEach(v => finalItems.push(v));

        html += `<div class="card"><div class="card-header"><span style="font-weight: 800; font-size: 15px; cursor: pointer;" onclick="window.setFirmaFilter('${firma}')">🏢 ${firma}</span><span style="font-size: 12px; font-weight: 700; color: var(--text-sec); background: #fff; border: 1px solid var(--border); padding: 4px 10px; border-radius: 8px;">${finalItems.length} Kayıt</span></div><div>`;

        finalItems.forEach(item => {
          const isVariant = window.isV(item.numune);
          const isSel = window.state.selectedIds.has(String(item.id));
          const note = (item.aciklama || '').split('|').pop() || '';
          const photos = window.state.photoCache[item.id] || [];

          // ID'LER STRING OLARAK FORMATLANDI, SQL İÇİN NUMBERA ÇEVRİLECEK.
          html += `
            <div class="list-item ${isVariant ? 'variant' : ''}" style="background: ${isSel ? '#F0F9FF' : 'transparent'}">
              <input type="checkbox" ${isSel ? 'checked' : ''} onclick="window.toggleSelection('${item.id}')" style="width: 16px; height: 16px; cursor: pointer; margin-top: 4px; flex-shrink: 0;" />
              <div style="flex: 1; min-width: 0;">
                <div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; margin-bottom: 8px;">
                  <h4 style="font-size: 14px; font-weight: 700; margin: 0; word-break: break-word;">${window.dName(item.numune) || 'İsimsiz'} ${item.fiyat ? `<span style="margin-left: 8px; font-family: monospace; font-size: 12px; color: #15803D; background: #DCFCE7; padding: 2px 6px; border-radius: 4px; border: 1px solid #BBF7D0;">${item.fiyat}</span>` : ''}</h4>
                  <span style="font-size: 11px; font-weight: 500; color: var(--text-sec); white-space: nowrap;">${window.formatDate(item.updated_at || item.created_at)}</span>
                </div>
                <div style="display: flex; flex-wrap: wrap; gap: 8px; align-items: center;">
                  <input type="text" value="${note}" placeholder="Not ekle..." onblur="window.updateNote('${item.id}', this.value, ${isVariant})" class="input" style="flex: 1; min-width: 150px; padding: 8px 10px; border-radius: 8px;" />
                  <select onchange="window.updateField('${item.id}', 'durum', this.value)" class="status-badge ${window.getStatusStyle(item.durum)}" style="padding: 8px 28px 8px 10px; font-size: 12px; appearance: none; outline: none; cursor: pointer;">
                    ${window.state.VALID_STATUS.map(s => `<option value="${s}" ${item.durum === s ? 'selected' : ''}>${s}</option>`).join('')}
                  </select>
                  <div style="display: flex; gap: 4px;">
                    <label class="btn-icon" style="position: relative; ${photos.length ? 'background: #ECFEFF; color: var(--primary);' : ''}">
                      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/></svg>
                      <input type="file" accept="image/*" multiple onchange="window.handlePhotoUpload(this, '${item.id}')" style="display: none;" />
                    </label>
                    <button onclick="window.openEditDrawer('${item.id}')" class="btn-icon"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"/></svg></button>
                    <button onclick="window.updateField('${item.id}', 'arsiv', ${!item.arsiv})" class="btn-icon"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect width="20" height="5" x="2" y="3" rx="1"/><path d="M4 8v11a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8"/><line x1="10" x2="14" y1="12" y2="12"/></svg></button>
                    <button onclick="window.deleteSample('${item.id}')" class="btn-icon" style="color: var(--red);"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg></button>
                  </div>
                </div>`;
          if(photos.length > 0) {
            html += `<div class="hide-scroll" style="display: flex; gap: 8px; overflow-x: auto; margin-top: 12px; padding-top: 12px; border-top: 1px solid rgba(0,0,0,0.05);">`;
            photos.forEach((p, idx) => {
              html += `<div style="position: relative; flex-shrink: 0;"><img src="${p.url}" onclick="window.openPhotoViewer('${item.id}', ${idx})" style="width: 48px; height: 48px; border-radius: 8px; object-fit: cover; border: 1px solid var(--border); cursor: pointer;" /><button onclick="window.deletePhoto('${item.id}', '${p.path}')" style="position: absolute; top: -6px; right: -6px; width: 20px; height: 20px; background: var(--red); color: #fff; border: 2px solid #fff; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0;"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button></div>`;
            });
            html += `</div>`;
          }
          html += `</div></div>`;
        });
        html += `</div></div>`;
      });
      container.innerHTML = html;

      const ba = document.getElementById('bulkActions');
      if(window.state.selectedIds.size > 0) {
        document.getElementById('selCount').innerText = window.state.selectedIds.size;
        ba.style.display = 'flex';
      } else ba.style.display = 'none';
    };

    // ID'leri Sayıya Çeviren Güvenli Güncelleme Fonksiyonu
    window.updateField = async function(id, field, val) {
      const qId = isNaN(id) ? id : Number(id); // Supabase Strict Type Koruması
      const {error} = await window.dbClient.from('numuneler').update({ [field]: val }).eq('id', qId);
      if(error) { window.showToast('Hata: ' + error.message, 'err'); return; }
      window.state.samples = window.state.samples.map(i => String(i.id) === String(id) ? { ...i, [field]: val } : i);
      window.renderSamples();
      window.showToast('Güncellendi');
    };

    window.updateNote = async function(id, noteVal, isVar) {
      const item = window.state.samples.find(i => String(i.id) === String(id));
      if(!item) return;
      let finalNote = noteVal;
      if(isVar) { const pc = (item.aciklama||'').split('|')[0]; finalNote = `${pc}|${noteVal}`; }
      await window.updateField(id, 'aciklama', finalNote);
    };

    window.deleteSample = async function(id) {
      if(!confirm('Kayıt tamamen silinsin mi?')) return;
      const qId = isNaN(id) ? id : Number(id);
      const {error} = await window.dbClient.from('numuneler').delete().eq('id', qId);
      if(error) { window.showToast('Hata: ' + error.message, 'err'); return; }
      window.state.samples = window.state.samples.filter(i => String(i.id) !== String(id));
      window.state.selectedIds.delete(String(id));
      window.renderSamples();
      window.showToast('Kalıcı olarak silindi');
    };

    // Drawer Düzenleme Fonksiyonları (Firma ismini de içerir)
    window.openEditDrawer = function(id) {
      const item = window.state.samples.find(i => String(i.id) === String(id));
      if(!item) return;
      window.state.editId = id;
      document.getElementById('drawerTitle').innerText = '✏️ Kaydı Düzenle';
      document.getElementById('formFirma').value = item.firma || ''; // FİRMA ADI BURAYA YÜKLENİYOR
      
      const v = window.isV(item.numune);
      const acParts = (item.aciklama||'').split('|');
      const note = acParts.length > 1 ? acParts[1] : item.aciklama;
      window.state.formRows = [{ id: Date.now(), kod: window.dName(item.numune), fiyat: (item.fiyat||'').replace(/^\$/,''), var: '', not: note||'' }];
      
      document.getElementById('addRowBtn').style.display = 'none';
      window.renderFormRows();
      document.getElementById('drawerOverlay').classList.add('open');
      document.getElementById('drawer').classList.add('open');
    };

    window.saveData = async function() {
      const f = document.getElementById('formFirma').value.toUpperCase().trim();
      if(!f) { window.showToast('Lütfen firma adı girin', 'err'); return; }

      const btn = document.getElementById('saveBtn');
      btn.innerText = 'Kaydediliyor...';
      btn.disabled = true;

      try {
        if(window.state.editId) {
          const r = window.state.formRows[0];
          const item = window.state.samples.find(i => String(i.id) === String(window.state.editId));
          const v = window.isV(item.numune);
          let ac = r.not;
          if(v) { const pc = (item.aciklama||'').split('|')[0]; ac = `${pc}|${r.not}`; }

          const payload = { firma: f, numune: v ? '↳ ' + r.kod : r.kod, fiyat: r.fiyat ? (r.fiyat.startsWith('$') ? r.fiyat : '$'+r.fiyat) : '', aciklama: ac };
          
          const qId = isNaN(window.state.editId) ? window.state.editId : Number(window.state.editId);
          await window.dbClient.from('numuneler').update(payload).eq('id', qId);
          window.state.samples = window.state.samples.map(i => String(i.id) === String(window.state.editId) ? { ...i, ...payload } : i); // YEREL OLARAK DA GÜNCELLİYORUZ
        } else {
          const pkg = [];
          window.state.formRows.forEach(r => {
            const k = r.kod.trim(), pr = r.fiyat.trim(), nt = r.not.trim(), vStr = r.var.trim();
            if(!k) return;
            const fs = pr ? (pr.startsWith('$') ? pr : '$'+pr) : '';
            pkg.push({ firma: f, numune: k, fiyat: fs, aciklama: nt, durum: 'Beklemede', arsiv: false });
            if(vStr) { vStr.split(',').forEach(v => { const vt = v.trim(); if(vt) pkg.push({ firma: f, numune: '↳ '+vt, fiyat: fs, aciklama: `${k}|${nt}`, durum: 'Beklemede', arsiv: false }); }); }
          });
          const {data} = await window.dbClient.from('numuneler').insert(pkg).select();
          if(data) window.state.samples.unshift(...data);
        }
        
        window.closeDrawer();
        window.renderAllViews();
        window.showToast('Başarıyla kaydedildi', 'ok');
      } catch (err) { window.showToast('Hata oluştu', 'err'); } 
      finally { btn.innerText = 'Kaydet'; btn.disabled = false; }
    };

    // ==========================================
    // 5. DİĞER SAYFALAR İÇİN FONKSİYONLAR (Dashboard, Müşteriler, vs.)
    // ==========================================
    window.renderDashboard = function() {
      document.getElementById('dashboardStats').innerHTML = `
        <div class="card" style="padding:24px; border-left:4px solid var(--primary);">
          <div style="font-size:12px; font-weight:700; color:var(--text-sec); text-transform:uppercase;">Toplam Numune</div>
          <div style="font-size:32px; font-weight:800; color:var(--text); margin-top:8px;">${window.state.samples.length}</div>
        </div>
        <div class="card" style="padding:24px; border-left:4px solid #16A34A;">
          <div style="font-size:12px; font-weight:700; color:var(--text-sec); text-transform:uppercase;">Kayıtlı Müşteri</div>
          <div style="font-size:32px; font-weight:800; color:var(--text); margin-top:8px;">${window.state.customers.length}</div>
        </div>
        <div class="card" style="padding:24px; border-left:4px solid #D97706;">
          <div style="font-size:12px; font-weight:700; color:var(--text-sec); text-transform:uppercase;">Aktif Notlar</div>
          <div style="font-size:32px; font-weight:800; color:var(--text); margin-top:8px;">${window.state.notes.length}</div>
        </div>
      `;
    };

    // Ortak Listeleme ve Silme Motoru (Müşteri, Fiyat, Notlar vs için)
    window.renderGenericList = function(stateKey, containerId, titleField, subField, tableName) {
      const c = document.getElementById(containerId);
      if(!c) return;
      const items = window.state[stateKey] || [];
      if(!items.length) { c.innerHTML = '<div style="padding:24px; text-align:center; color:var(--text-sec); background:#fff; border-radius:12px; border:1px dashed var(--border);">Kayıt bulunamadı.</div>'; return; }
      
      let html = '<div style="display:grid; gap:12px; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));">';
      items.forEach(x => {
        html += `<div class="card" style="padding:16px; margin:0; display:flex; justify-content:space-between; align-items:center;">
          <div style="min-width:0;">
            <h4 style="font-size:14px; font-weight:700; margin:0; color:var(--text); text-overflow:ellipsis; overflow:hidden; white-space:nowrap;">${x[titleField] || 'İsimsiz'}</h4>
            ${subField && x[subField] ? `<p style="font-size:12px; color:var(--text-sec); margin-top:4px;">${x[subField]}</p>` : ''}
          </div>
          <button onclick="window.deleteGenericRecord('${tableName}', '${stateKey}', '${x.id}')" class="btn-icon" style="color:var(--red); flex-shrink:0;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg></button>
        </div>`;
      });
      c.innerHTML = html + '</div>';
    };

    window.addGenericRecord = async function(table) {
      const title = prompt('Lütfen eklenecek bilginin başlığını/adını girin:');
      if(!title) return;
      let p = {};
      if(table === 'musteriler') p = { firma_adi: title };
      if(table === 'notlar') p = { baslik: title, icerik: prompt('İçerik/Detay girin (İsteğe bağlı):') || '' };
      if(table === 'fiyatlar') p = { urun_adi: title, fiyat: prompt('Fiyat bilgisi:') || '' };
      if(table === 'maliyetler') p = { urun: title, maliyet: prompt('Maliyet bilgisi:') || '' };
      if(table === 'teklifler') p = { firma: title, tutar: prompt('Tutar bilgisi:') || '' };

      const {data, error} = await window.dbClient.from(table).insert([p]).select();
      if(error) { window.showToast('Eklenirken hata: ' + error.message, 'err'); return; }
      if(data && data.length) {
        if(table === 'musteriler') window.state.customers.unshift(data[0]);
        if(table === 'notlar') window.state.notes.unshift(data[0]);
        if(table === 'fiyatlar') window.state.prices.unshift(data[0]);
        if(table === 'maliyetler') window.state.costs.unshift(data[0]);
        if(table === 'teklifler') window.state.offers.unshift(data[0]);
      }
      window.renderAllViews();
      window.showToast('Başarıyla eklendi');
    };

    window.deleteGenericRecord = async function(table, stateKey, id) {
      if(!confirm('Bu kaydı tamamen silmek istediğinize emin misiniz?')) return;
      const qId = isNaN(id) ? id : Number(id);
      const {error} = await window.dbClient.from(table).delete().eq('id', qId);
      if(error) { window.showToast('Silinemedi', 'err'); return; }
      window.state[stateKey] = window.state[stateKey].filter(x => String(x.id) !== String(id));
      window.renderAllViews();
      window.showToast('Silindi');
    };

    window.calcConv = function(type, val) {
      const v = parseFloat(val); if(isNaN(v) || v<=0) return;
      if(type==='ne') { document.getElementById('conv-nm').value = (v * 1.693).toFixed(2); document.getElementById('conv-den').value = (5315 / v).toFixed(2); }
      if(type==='nm') { document.getElementById('conv-ne').value = (v / 1.693).toFixed(2); document.getElementById('conv-den').value = (9000 / v).toFixed(2); }
      if(type==='den'){ document.getElementById('conv-ne').value = (5315 / v).toFixed(2); document.getElementById('conv-nm').value = (9000 / v).toFixed(2); }
    };

    // Helper functions (SetFilter vb.) ve UI Drawer Fonksiyonları
    window.setFilter = function(f) { window.state.filter = f; window.renderSamples(); };
    window.changeSort = function(s) { window.state.sortType = s; window.renderSamples(); };
    window.setFirmaFilter = function(f) { window.state.firmaFilter = f; window.renderSamples(); };
    window.toggleSelection = function(id) { const sId = String(id); window.state.selectedIds.has(sId) ? window.state.selectedIds.delete(sId) : window.state.selectedIds.add(sId); window.renderSamples(); };
    window.clearSelection = function() { window.state.selectedIds.clear(); window.renderSamples(); };
    window.closeDrawer = function() { document.getElementById('drawerOverlay').classList.remove('open'); document.getElementById('drawer').classList.remove('open'); };
    window.addFormRow = function() { window.state.formRows.push({ id: Date.now(), kod: '', fiyat: '', var: '', not: '' }); window.renderFormRows(); };
    window.removeFormRow = function(id) { window.state.formRows = window.state.formRows.filter(r => r.id !== id); window.renderFormRows(); };
    window.updateFormRow = function(id, field, val) { window.state.formRows = window.state.formRows.map(r => r.id === id ? { ...r, [field]: val } : r); };
    window.showFirmaDropdown = function() { document.getElementById('firmaDropdown').style.display = 'block'; };
    window.filterFirmaDropdown = function() { const q = document.getElementById('formFirma').value.toLowerCase(); const dd = document.getElementById('firmaDropdown'); let html = ''; window.state.customers.filter(c => c.toLowerCase().includes(q)).slice(0,10).forEach(c => { html += `<div onclick="document.getElementById('formFirma').value='${c}'; document.getElementById('firmaDropdown').style.display='none';" style="padding: 12px 16px; border-bottom: 1px solid rgba(0,0,0,0.05); font-size: 14px; font-weight: 600; cursor: pointer;">${c}</div>`; }); dd.innerHTML = html; dd.style.display = 'block'; };
    window.bulkUpdateStatus = async function(st) { const ids = Array.from(window.state.selectedIds); await window.dbClient.from('numuneler').update({ durum: st }).in('id', ids.map(Number)); window.state.samples = window.state.samples.map(i => ids.includes(String(i.id)) ? { ...i, durum: st } : i); window.state.selectedIds.clear(); window.renderSamples(); window.showToast('Toplu güncellendi'); };
    window.bulkDelete = async function() { if(!confirm('Seçili kayıtlar silinsin mi?')) return; const ids = Array.from(window.state.selectedIds); await window.dbClient.from('numuneler').delete().in('id', ids.map(Number)); window.state.samples = window.state.samples.filter(i => !ids.includes(String(i.id))); window.state.selectedIds.clear(); window.renderSamples(); window.showToast('Kayıtlar silindi'); };

    window.globalSearch = function() {
      const q = document.getElementById('globalSearch').value;
      document.getElementById('searchInput').value = q;
      window.renderSamples();
    };

    window.exportExcel = async function() {
      const wb = new ExcelJS.Workbook(); const sh = wb.addWorksheet('Numuneler');
      sh.addRow(['İSTEKÇİ FİRMA', 'NUMUNE', 'FİYAT', 'DURUM', 'NOTLAR', 'TARİH']);
      let exp = [...window.state.samples];
      if (window.state.filter === 'Arşiv') exp = exp.filter(i => i.arsiv === true); else { exp = exp.filter(i => i.arsiv !== true); if (window.state.filter !== 'Hepsi') exp = exp.filter(i => i.durum === window.state.filter); }
      if (window.state.firmaFilter) exp = exp.filter(i => (i.firma || '').toUpperCase() === window.state.firmaFilter.toUpperCase());
      exp.sort((a,b) => (a.firma||'').localeCompare(b.firma||'')).forEach(i => { const v = window.isV(i.numune); const pc = (i.aciklama||'').split('|')[0]; const note = (i.aciklama||'').includes('|') ? (i.aciklama||'').split('|')[1] : i.aciklama; const excelAd = v ? (pc ? pc+'-'+window.dName(i.numune) : window.dName(i.numune)) : window.dName(i.numune); const dt = i.updated_at ? new Date(i.updated_at).toLocaleDateString('tr-TR') : ''; sh.addRow([i.firma||'', excelAd, i.fiyat||'-', i.durum||'', note||'-', dt]); });
      const buf = await wb.xlsx.writeBuffer(); const blob = new Blob([buf], {type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}); const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `Yanteks_Numune_${new Date().toLocaleDateString('tr-TR')}.xlsx`; a.click();
    };

    window.closePhotoViewer = function() { document.getElementById('photoViewer').classList.remove('open'); };
    window.pvNav = function(dir) { window.state.currentPvIndex += dir; if(window.state.currentPvIndex < 0) window.state.currentPvIndex = 0; if(window.state.currentPvIndex >= window.state.currentPvPhotos.length) window.state.currentPvIndex = window.state.currentPvPhotos.length - 1; document.getElementById('pvImage').src = window.state.currentPvPhotos[window.state.currentPvIndex].url; document.getElementById('pvCounter').innerText = `${window.state.currentPvIndex + 1} / ${window.state.currentPvPhotos.length}`; };
    window.deleteCurrentPhoto = async function() { const p = window.state.currentPvPhotos[window.state.currentPvIndex]; await window.deletePhoto(p.sampleId, p.path); window.closePhotoViewer(); };

    // ==========================================
    // 5. BAŞLATICI (INIT)
    // ==========================================
    window.onload = function() {
      window.fetchData();
    };

  </script>
</body>
</html>
