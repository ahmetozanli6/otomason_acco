<script>

const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

let state = {

const menuItems = [

async function initApp() {
    renderLoading();
    try {
        // Supabase bağlantı testi

function toggleDrawer() {
    const sidebar = document.getElementById('sidebar');
    const overlay = document.getElementById('drawer-overlay');
    
    if (sidebar.classList.contains('-translate-x-full')) {
        sidebar.classList.remove('-translate-x-full');
        overlay.classList.remove('hidden');
    } else {
        sidebar.classList.add('-translate-x-full');
        overlay.classList.add('hidden');
    }
}

function showError(msg) {
    const box = document.getElementById('error-box');
    document.getElementById('error-text').innerText = msg;
    box.classList.remove('hidden');
}

function renderMenu() {
    const nav = document.getElementById('menu-nav');
    nav.innerHTML = menuItems.map(item => `
        <button onclick="changeTab('${item.id}')" 
            class="w-full flex items-center gap-4 px-4 py-3 rounded-lg transition-all duration-200 
            ${state.activeTab === item.id ? 'bg-[#0891B2] text-white shadow-md' : 'text-gray-400 hover:bg-gray-800 hover:text-gray-200'}">
            <i data-lucide="${item.icon}" class="w-5 h-5"></i>
            <span class="font-medium">${item.label}</span>
        </button>
    `).join('');
    lucide.createIcons();
}

function renderLoading() {
    document.getElementById('content-area').innerHTML = `
        <div class="flex flex-col items-center justify-center h-full">

            <h2 class="text-[#1E2D3D] text-lg font-semibold">Veriler Çekiliyor...</h2>

async function changeTab(tabId) {
    state.activeTab = tabId;
    document.getElementById('header-title').innerText = tabId;
    renderMenu();
    
    // Mobilde sekmeye tıklayınca menüyü kapat

    const contentArea = document.getElementById('content-area');
    
    switch(tabId) {

    }
    lucide.createIcons(); // İkonları DOM'a tekrar işle
}

// ==========================================
// 4. MODÜLLER (SAYFALAR)

// --- NUMUNE ---
async function renderNumune(container) {
    renderLoading();
    try {
        const { data, error } = await supabase.from('numuneler').select('*').order('id', { ascending: false });
        if(error && error.code === '42P01') {
            state.numuneler = [
                { id: 1, firma: 'LC Waikiki', numune: 'Pamuklu Süprem', durum: 'Onaylandı', fiyat: '$3.50', updated_at: new Date().toISOString() },
                { id: 2, firma: 'Defacto', numune: 'Polyester Polar', durum: 'Bekliyor', fiyat: '$2.80', updated_at: new Date().toISOString() }
            ];
        } else if(data) {
            state.numuneler = data;
        }
    } catch(e) {}

    let rows = state.numuneler.map(n => {
        const bg = (n.durum === 'Onaylandı' || n.durum === 'Olumlu') ? 'bg-green-100 text-green-700 border-green-200' : 
                   (n.durum === 'Reddedildi' || n.durum === 'Olumsuz') ? 'bg-red-100 text-red-700 border-red-200' : 'bg-yellow-100 text-yellow-700 border-yellow-200';
        const dateStr = n.updated_at ? new Date(n.updated_at).toLocaleDateString('tr-TR') : '-';
        return `
        <tr class="border-b border-gray-50 hover:bg-blue-50/50 transition-colors">
            <td class="p-4 font-medium text-[#1E2D3D]">${n.firma || '-'}</td>
            <td class="p-4 text-gray-700">${n.numune || '-'}</td>
            <td class="p-4"><span class="px-3 py-1 rounded-full text-xs font-semibold border ${bg}">${n.durum || 'Bekliyor'}</span></td>
            <td class="p-4 font-medium text-gray-700">${n.fiyat || '-'}</td>
            <td class="p-4 text-gray-500 text-sm">${dateStr}</td>
        </tr>`;
    }).join('');

    if(state.numuneler.length === 0) rows = `<tr><td colSpan="5" class="p-8 text-center text-gray-500">Kayıt bulunamadı.</td></tr>`;

    container.innerHTML = `
        <div class="space-y-6 animate-fade-in">
            <div class="flex justify-between items-center bg-white p-4 rounded-xl shadow-sm border border-gray-100">
                <div>
                    <h3 class="font-semibold text-lg text-[#1E2D3D]">Numune Takibi</h3>
                    <p class="text-gray-500 text-sm">Toplam ${state.numuneler.length} kayıtlı numune bulunuyor.</p>
                </div>
                <button class="bg-[#0891B2] text-white px-4 py-2.5 rounded-lg flex items-center gap-2 hover:bg-[#067a96] shadow-sm font-medium transition">
                    <i data-lucide="plus" class="w-5 h-5"></i> Yeni Ekle
                </button>
            </div>
            <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse min-w-[600px]">
                        <thead>
                            <tr class="bg-gray-50 border-b border-gray-200 text-gray-600 text-sm">
                                <th class="p-4 font-semibold">Firma</th>
                                <th class="p-4 font-semibold">Numune Adı</th>
                                <th class="p-4 font-semibold">Durum</th>
                                <th class="p-4 font-semibold">Fiyat</th>
                                <th class="p-4 font-semibold">Tarih</th>
                            </tr>
                        </thead>
                        <tbody>${rows}</tbody>
                    </table>
                </div>
            </div>
        </div>
    `;
}

// --- MÜŞTERİ ---
async function renderMusteri(container) {
    renderLoading();
    try {
        const { data, error } = await supabase.from('musteriler').select('*');
        if(error && error.code === '42P01') state.musteriler = [];
        else if(data) state.musteriler = data;
    } catch(e) {}

    let cards = state.musteriler.map(m => `

        </div>
    `).join('');

    if(state.musteriler.length === 0) {
        cards = `
        <div class="col-span-full text-center py-12">
            <i data-lucide="users" class="w-16 h-16 mx-auto text-gray-300 mb-4"></i>
            <p class="text-gray-500 mb-6">Henüz müşteri verisi bulunmuyor.</p>
        </div>`;
    }

    container.innerHTML = `
        <div class="bg-white p-8 rounded-xl shadow-sm border border-gray-100 min-h-[400px] animate-fade-in">

                <button class="bg-[#1E2D3D] text-white px-4 py-2 rounded-lg flex items-center gap-2 hover:bg-black transition">

                </button>

            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">${cards}</div>
        </div>
    `;
}

function renderTeklifler(container) {

// --- NOTLARIM ---
async function renderNotlarim(container) {
    renderLoading();
    try {
        const { data, error } = await supabase.from('notlar').select('*').order('created_at', { ascending: false });
        if(error && error.code === '42P01') {
            state.notlar = [
                { id: '1', icerik: "Yarın LCW toplantısı için numuneleri hazırla.", created_at: new Date().toISOString() }
            ];
        } else if(data) {
            state.notlar = data;
        }
    } catch(e) {}

    window.addNot = async function() {
        const input = document.getElementById('not-input');
        const val = input.value.trim();
        if(!val) return;
        
        document.getElementById('not-btn').innerText = '...';
        document.getElementById('not-btn').disabled = true;

        try {
            const { data, error } = await supabase.from('notlar').insert([{ icerik: val }]).select();
            if (!error && data) state.notlar.unshift(data[0]);
            else state.notlar.unshift({ id: Date.now().toString(), icerik: val, created_at: new Date().toISOString() });
        } catch(e) {}
        
        renderNotlarim(container); // Re-render
    };

    window.deleteNot = async function(id) {
        try {
            await supabase.from('notlar').delete().eq('id', id);
            state.notlar = state.notlar.filter(x => x.id != id);
            renderNotlarim(container);
        } catch(e) {}
    }

    let notCards = state.notlar.map(n => `
        <div class="bg-white p-5 rounded-xl shadow-sm border border-gray-100 relative group hover:border-[#0891B2] transition-colors">
            <p class="text-gray-800 pr-8 text-lg">${n.icerik || n.text}</p>
            <span class="text-xs text-gray-400 mt-3 flex items-center gap-1">
                <i data-lucide="clock" class="w-3 h-3"></i> 
                ${new Date(n.created_at).toLocaleDateString('tr-TR', { day:'numeric', month:'short', hour:'2-digit', minute:'2-digit' })}
            </span>
            <button onclick="deleteNot('${n.id}')" class="absolute top-4 right-4 p-2 bg-red-50 text-red-500 rounded-lg opacity-0 group-hover:opacity-100 transition-opacity hover:bg-red-500 hover:text-white">
                <i data-lucide="trash-2" class="w-4 h-4"></i>
            </button>
        </div>
    `).join('');

    container.innerHTML = `
        <div class="max-w-3xl mx-auto space-y-6 animate-fade-in">
            <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
                <h3 class="font-bold text-lg mb-4 text-[#1E2D3D] flex items-center gap-2"><i data-lucide="edit-3" class="text-[#0891B2]"></i> Hızlı Not Ekle</h3>
                <div class="flex gap-3">
                    <input type="text" id="not-input" onkeypress="event.key === 'Enter' && addNot()" placeholder="Aklınıza gelen bir şeyi yazın..." class="flex-1 bg-gray-50 border border-gray-200 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-[#0891B2] transition" />
                    <button id="not-btn" onclick="addNot()" class="bg-[#1E2D3D] text-white px-8 py-3 rounded-lg hover:bg-black font-medium transition">Kaydet</button>
                </div>
            </div>
            <div class="grid gap-4">${notCards}</div>
        </div>
    `;
    lucide.createIcons();
}

// --- DÖNÜŞTÜRÜCÜ ---
function renderDonusturucu(container) {
    window.calcDonusturucu = function() {
        const kg = parseFloat(document.getElementById('d-kg').value);
        const gr = parseFloat(document.getElementById('d-gr').value) || 150;
        
        const resBox = document.getElementById('d-res');
        if(!kg || isNaN(kg)) {
            resBox.innerHTML = '<div class="text-center text-gray-400 italic">Sonuçları görmek için miktar giriniz.</div>';
            return;
        }

        const metre = (kg * 1000 / gr).toFixed(2);
        const lbs = (kg * 2.20462).toFixed(2);

        resBox.innerHTML = `
            <div class="space-y-4 animate-fade-in">
                <div class="bg-white p-4 rounded-lg shadow-sm border border-gray-100 text-center">
                    <span class="block text-xs text-gray-400 uppercase tracking-wider mb-1">Uzunluk (Metre)</span>
                    <span class="text-2xl font-bold text-[#0891B2]">${metre} m</span>
                </div>
                <div class="bg-white p-4 rounded-lg shadow-sm border border-gray-100 text-center">
                    <span class="block text-xs text-gray-400 uppercase tracking-wider mb-1">İngiliz Birimi (Lbs)</span>
                    <span class="text-2xl font-bold text-[#1E2D3D]">${lbs} lbs</span>
                </div>
            </div>
        `;
    };

    container.innerHTML = `
        <div class="max-w-2xl mx-auto bg-white p-8 rounded-xl shadow-sm border border-gray-100 animate-fade-in">
            <div class="flex items-center gap-3 mb-6 border-b pb-4">
                <div class="p-3 bg-blue-50 rounded-lg text-[#0891B2]"><i data-lucide="refresh-cw"></i></div>
                <h3 class="text-xl font-bold text-[#1E2D3D]">Tekstil Birim Dönüştürücü</h3>
            </div>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-1">Miktar (Kg)</label>
                        <input type="number" id="d-kg" placeholder="Örn: 100" oninput="calcDonusturucu()" class="w-full border border-gray-300 rounded-lg px-4 py-2.5 focus:ring-2 focus:ring-[#0891B2] outline-none transition" />
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-1">Kumaş Gramajı (gr/m²)</label>
                        <input type="number" id="d-gr" value="150" oninput="calcDonusturucu()" class="w-full border border-gray-300 rounded-lg px-4 py-2.5 focus:ring-2 focus:ring-[#0891B2] outline-none transition" />
                    </div>
                </div>
                
                <div class="bg-[#F8FAFC] p-6 rounded-xl border border-gray-200 flex flex-col justify-center">
                    <h4 class="text-gray-500 font-medium mb-4 text-center">Hesaplanan Sonuçlar</h4>
                    <div id="d-res"><div class="text-center text-gray-400 italic">Sonuçları görmek için miktar giriniz.</div></div>
                </div>
            </div>
        </div>
    `;
}

// --- MALİYET ---
function renderMaliyet(container) {
    window.calcMaliyet = function() {
        const iplik = parseFloat(document.getElementById('m-iplik').value) || 0;
        const orme = parseFloat(document.getElementById('m-orme').value) || 0;
        const boya = parseFloat(document.getElementById('m-boya').value) || 0;
        const fire = parseFloat(document.getElementById('m-fire').value) || 0;

        const total = (iplik + orme + boya) * (1 + (fire / 100));
        document.getElementById('m-total').innerText = '$' + total.toFixed(2);
    };

    container.innerHTML = `
        <div class="max-w-4xl mx-auto space-y-6 animate-fade-in">
            <div class="bg-white p-8 rounded-xl shadow-sm border border-gray-100">
                <div class="flex items-center gap-3 mb-8 border-b pb-4">
                    <div class="p-3 bg-[#1E2D3D] rounded-lg text-white"><i data-lucide="calculator"></i></div>
                    <h3 class="text-xl font-bold text-[#1E2D3D]">Detaylı Kumaş Maliyet Hesaplayıcı</h3>
                </div>
                
                <div class="grid grid-cols-1 lg:grid-cols-2 gap-10">
                    <div class="space-y-5">
                        <div class="relative">
                            <label class="block text-sm font-semibold text-gray-700 mb-1">İplik Maliyeti ($/kg)</label>
                            <input type="number" id="m-iplik" step="0.1" value="3.50" oninput="calcMaliyet()" class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:ring-2 focus:ring-[#0891B2] outline-none text-lg" />
                        </div>
                        <div class="relative">
                            <label class="block text-sm font-semibold text-gray-700 mb-1">Örme Maliyeti ($/kg)</label>
                            <input type="number" id="m-orme" step="0.1" value="0.40" oninput="calcMaliyet()" class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:ring-2 focus:ring-[#0891B2] outline-none text-lg" />
                        </div>
                        <div class="relative">
                            <label class="block text-sm font-semibold text-gray-700 mb-1">Boya / Apre Maliyeti ($/kg)</label>
                            <input type="number" id="m-boya" step="0.1" value="1.20" oninput="calcMaliyet()" class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:ring-2 focus:ring-[#0891B2] outline-none text-lg" />
                        </div>
                        <div class="relative">
                            <label class="block text-sm font-semibold text-gray-700 mb-1">Fire Oranı (%)</label>
                            <input type="number" id="m-fire" value="5" oninput="calcMaliyet()" class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:ring-2 focus:ring-[#0891B2] outline-none text-lg" />
                        </div>
                    </div>

                    <div class="bg-gradient-to-br from-[#1E2D3D] to-[#2A4055] text-white p-8 rounded-2xl flex flex-col justify-between shadow-lg relative overflow-hidden">
                        <i data-lucide="calculator" class="absolute -right-10 -top-10 w-64 h-64 opacity-10 text-white pointer-events-none"></i>
                        <div class="relative z-10">
                            <p class="text-gray-300 font-medium tracking-wide uppercase text-sm mb-2">Tahmini Toplam Maliyet</p>
                            <div id="m-total" class="text-6xl font-black text-white mb-2 tracking-tighter">$5.36</div>
                            <p class="text-[#0891B2] font-medium text-lg">Kilogram Başına</p>
                        </div>
                        <div class="mt-8 pt-6 border-t border-gray-600 relative z-10">
                            <button class="w-full bg-[#0891B2] hover:bg-[#067a96] text-white py-4 rounded-xl font-bold text-lg transition-all shadow-md flex items-center justify-center gap-2">
                                <i data-lucide="save"></i> Teklife Ekle
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    `;
}

// Uygulamayı Başlat
window.onload = initApp;

</script>
